<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 90" width="840" height="180" role="img" aria-label="Groundwork Security &amp; Compliance">
  <rect width="420" height="90" fill="#1c2e26"/>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,560&amp;family=Outfit:wght@400;500;600&amp;display=swap");
    .word { font-family: Fraunces, "Iowan Old Style", Georgia, serif; font-weight: 560; letter-spacing: -0.04em; fill: #171c19; }
    .word-rev { font-family: Fraunces, "Iowan Old Style", Georgia, serif; font-weight: 560; letter-spacing: -0.04em; fill: #f4efe6; }
    .sub { font-family: Outfit, "Avenir Next", system-ui, sans-serif; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; fill: #5a635d; }
    .sub-rev { font-family: Outfit, "Avenir Next", system-ui, sans-serif; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; fill: #a8b5a0; }
  </style>
  <text class="word-rev" x="24" y="48" font-size="36">Groundwork</text>
